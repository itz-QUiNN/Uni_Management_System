<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Create Lecture</title>
  </head>
  <body>
    <h1>Create Lecture</h1>

    <form class="lecture-form">
      <div class="form-group">
        <label for="module">Module:</label>
        <input type="text" id="module" placeholder="e.g., Stats" />
      </div>

      <div class="form-group">
        <label for="time">Time:</label>
        <input type="time" id="time" step="1" />
      </div>

      <div class="form-group">
        <label for="date">Date:</label>
        <input type="date" id="date" />
      </div>

      <div id="error"></div>

      <button type="button" id="submit-btn">Create Lecture</button>
    </form>

    <script src="../js/create_lecture.js"></script>
  </body>
</html>
