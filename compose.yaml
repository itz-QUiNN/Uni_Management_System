services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: uni-management-system:local
    container_name: php-web
    ports:
      - "8080:80"
    volumes:
      - ./system:/var/www/html:Z
    depends_on:
      - db

  db:
    image: docker.io/library/mariadb:11.4
    container_name: uni-management-system
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: docker.io/phpmyadmin:5.2.2
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data: